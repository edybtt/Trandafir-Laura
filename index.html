<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O invitație de sâmbătă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: one centered evening card — photo, the offered rose, a short note, one button. Single deliberate dusk look. */
:root {
  --night: #1f1119;
  --wine: #3a1a2a;
  --petal: #e2405a;
  --blush: #f6d9dc;
  --muted: #c9a3ab;
  --glow: rgba(226, 64, 90, 0.28);
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 30%, var(--wine) 0%, var(--night) 70%);
  background-color: var(--night);
  color: var(--blush);
  font-family: var(--serif);
  padding-inline: 16px;
  padding-block: 0;
  overflow-x: hidden;
}
.stage {
  min-height: 100%;
  max-width: 30rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.4rem;
  padding-block: 2.5rem;
  text-align: center;
  position: relative;
}
.to {
  font-family: var(--hand);
  font-size: 1.6rem;
  color: var(--muted);
  margin: 0;
  animation: rise .9s ease-out both;
}
.scene {
  position: relative;
  width: 17rem;
  max-width: 100%;
  height: 12.5rem;
}
.photo {
  position: absolute;
  left: 0;
  top: 0;
  width: 9.5rem;
  height: 9.5rem;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--blush);
  box-shadow: 0 0 0 8px var(--glow), 0 18px 40px rgba(0,0,0,.45);
  animation: rise .9s .15s ease-out both;
}
.hat {
  position: absolute;
  left: 3.72rem;
  top: -1.52rem;
  width: 5.75rem;
  height: auto;
  opacity: 0;
  transform: rotate(-9deg);
  transform-origin: 50% 92%;
  filter: drop-shadow(0 6px 8px rgba(0,0,0,.45));
  pointer-events: none;
}
.scene.cooked .hat {
  opacity: 1;
  animation: hatdrop 1s .45s cubic-bezier(.3,.7,.3,1) both;
}
.offer {
  position: absolute;
  right: -0.5rem;
  bottom: 0;
  width: 9rem;
  height: 9rem;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: give 1.6s .7s cubic-bezier(.2,.8,.25,1) both;
  transform-origin: 20% 80%;
}
.offer.taken { cursor: default; }
.offer .hand {
  position: absolute;
  left: 0;
  bottom: 0.4rem;
  font-size: 6rem;
  line-height: 1;
  filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));
}
.offer .rose {
  position: absolute;
  left: 2.3rem;
  bottom: 3.6rem;
  font-size: 4.2rem;
  line-height: 1;
  transform: rotate(-12deg);
  filter: drop-shadow(0 0 18px var(--glow));
  transition: transform 1.3s cubic-bezier(.2,.8,.25,1), opacity 1.3s ease-in;
}
.offer.taken .rose {
  transform: translate(-3rem, 2rem) rotate(0deg) scale(3.2);
  opacity: 0;
}
.note {
  display: flex;
  flex-direction: column;
  gap: .55rem;
  max-width: 26rem;
}
.note p {
  margin: 0;
  font-size: clamp(1.3rem, 4.6vw, 1.6rem);
  line-height: 1.35;
  font-style: italic;
  text-wrap: balance;
  animation: rise 1s ease-out both;
}
.note p:nth-child(1) { animation-delay: 1.8s; }
.note p:nth-child(2) { animation-delay: 2.5s; }
.sign {
  font-family: var(--hand);
  font-size: 1.9rem;
  color: var(--petal);
  margin: 0;
  animation: rise 1s 3.1s ease-out both;
}
button {
  font-family: var(--serif);
  font-size: 1.15rem;
  font-weight: 500;
  letter-spacing: .04em;
  color: var(--night);
  background: var(--blush);
  border: 0;
  border-radius: 999px;
  padding: .7rem 1.6rem;
  cursor: pointer;
  box-shadow: 0 0 0 6px var(--glow);
  animation: rise 1s 3.5s ease-out both;
  transition: transform .2s ease, box-shadow .2s ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 0 0 9px var(--glow); }
button:focus-visible { outline: 2px solid var(--petal); outline-offset: 4px; }
.after {
  font-family: var(--hand);
  font-size: 1.7rem;
  line-height: 1.2;
  color: var(--blush);
  margin: 0;
  text-wrap: balance;
  animation: rise .9s 1.5s ease-out both;
}
.after[hidden] { display: none; }
.petal {
  position: fixed;
  top: -2rem;
  width: .8rem;
  height: 1.1rem;
  background: var(--petal);
  border-radius: 70% 0 70% 0;
  opacity: .85;
  pointer-events: none;
  animation: fall linear forwards;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@keyframes give {
  0% { opacity: 0; transform: translate(4rem, 1rem) rotate(8deg) scale(.7); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes hatdrop {
  0% { opacity: 0; transform: translateY(-6rem) rotate(-30deg) scale(.75); }
  20% { opacity: 1; }
  55% { transform: translateY(.3rem) rotate(-3deg) scale(1.06, .92); }
  78% { transform: translateY(-.2rem) rotate(-12deg) scale(.98, 1.03); }
  100% { opacity: 1; transform: rotate(-9deg); }
}
@keyframes fall {
  to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 380px) {
  .scene { transform: scale(.9); }
}
</style>
</head>

<script>
(function () {
  var TOPIC = 'https://ntfy.sh/trandafir-laura-a324089c280e';
  var isTest = /[?&]test\b/.test(location.search);
  var ua = navigator.userAgent || '';
  var isBot = navigator.webdriver === true ||
    /\bbot\b|bot[\/\-;]|crawl|spider|slurp|headless|lighthouse|facebookexternalhit|phantom|puppeteer|playwright|selenium/i.test(ua) ||
    !navigator.languages || navigator.languages.length === 0;
  function notify(msg) {
    if (isTest || isBot) return;
    try { fetch(TOPIC, { method: 'POST', body: msg, keepalive: true }).catch(function () {}); } catch (e) {}
  }

  // „A deschis” pleacă doar după câteva secunde cu pagina vizibilă, ca să nu-l declanșeze scanerele care trec în grabă.
  var OPEN_DELAY = 4000;
  var opened = false;
  var openTimer = null;
  function sendOpened() {
    if (opened) return;
    opened = true;
    clearTimeout(openTimer);
    document.removeEventListener('visibilitychange', watchVisibility);
    notify('A deschis pagina 👀');
  }
  function watchVisibility() {
    clearTimeout(openTimer);
    if (document.visibilityState === 'visible') openTimer = setTimeout(sendOpened, OPEN_DELAY);
  }
  document.addEventListener('visibilitychange', watchVisibility);
  watchVisibility();
  var btn = document.getElementById('take');
  var offer = document.getElementById('offer');
  var scene = document.getElementById('scene');
  var after = document.getElementById('after');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function petals(n) {
    if (reduce) return;
    for (var i = 0; i < n; i++) {
      var p = document.createElement('span');
      p.className = 'petal';
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = (3.5 + Math.random() * 3) + 's';
      p.style.animationDelay = (Math.random() * 1.5) + 's';
      p.style.opacity = (0.5 + Math.random() * 0.45).toFixed(2);
      document.body.appendChild(p);
      p.addEventListener('animationend', function (e) { e.target.remove(); });
    }
  }

  // Merge și butonul, și apăsarea direct pe trandafir. După ce îl ia, apare toca de bucătar pe poză.
  var taken = false;
  function take() {
    if (taken) return;
    taken = true;
    offer.classList.add('taken');
    scene.classList.add('cooked');
    sendOpened();
    notify('A luat trandafirul 🌹');
    btn.hidden = true;
    after.hidden = false;
    petals(28);
  }
  btn.addEventListener('click', take);
  offer.addEventListener('click', take);
})();
</script>
